    <meta
      name="description"
      content="37NDEST - a focused Japanese conversation trainer for two users preparing for a mission trip."

    <!-- V2 theme-color: dual light/dark meta tags -->
    <meta name="theme-color" content="#f5efe4" media="(prefers-color-scheme: light)" />

    <!-- Google Fonts: V2 typography stack

         Self-hosting with subsetting is the target after content stabilizes (Phase 3+).
         font-display=swap ensures the app renders immediately with fallback fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>37NDEST</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>
